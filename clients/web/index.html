<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORCA — push to talk</title>
    <style>
      :root {
        --ink: #102a2e;
        --muted: #607579;
        --paper: #f6f4ed;
        --line: #d9dfd7;
        --sea: #087e8b;
        --sun: #f4b942;
        --danger: #c94c4c;
      }
      * { box-sizing: border-box; }
      body {
        font-family: Georgia, "Times New Roman", serif;
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        background-image: radial-gradient(#d9dfd7 0.7px, transparent 0.7px);
        background-size: 18px 18px;
      }
      main { max-width: 720px; margin: 0 auto; padding: 36px 20px 64px; }
      .kicker { color: var(--sea); font: 700 0.76rem/1.2 "Helvetica Neue", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
      h1 { font-size: clamp(2.2rem, 7vw, 4.2rem); line-height: 0.9; margin: 8px 0 12px; font-weight: 400; }
      p { font: 1rem/1.5 "Helvetica Neue", sans-serif; color: var(--muted); }
      label { display: grid; gap: 6px; font: 700 0.72rem/1.2 "Helvetica Neue", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); }
      select, input[type="text"], textarea, button {
        font: 600 0.95rem "Helvetica Neue", sans-serif;
        border: 1px solid var(--line);
        padding: 11px 14px;
        min-height: 42px;
        background: white;
      }
      textarea { width: 100%; min-height: 72px; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
      .check { display: flex; align-items: center; gap: 8px; font: 0.9rem "Helvetica Neue", sans-serif; text-transform: none; letter-spacing: 0; font-weight: 500; }
      button { background: var(--sun); color: var(--ink); cursor: pointer; border: 0; }
      button.secondary { background: var(--ink); color: white; }
      button.danger { background: var(--danger); color: white; }
      #answer {
        margin-top: 24px;
        padding: 18px;
        background: rgba(255,255,255,0.85);
        border: 1px solid var(--line);
        min-height: 120px;
        font: 1.05rem/1.5 "Helvetica Neue", sans-serif;
      }
      #answer strong { display: block; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sea); margin-bottom: 8px; }
      .cite { color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
      .status { font: 0.8rem "Helvetica Neue", sans-serif; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">Voice-first marine safety</div>
      <h1>ORCA</h1>
      <p>Ask where the nearest fishing zone is, or whether it is safe to go out. Every number is sourced and timestamped. Kill the weather source to hear the system refuse to guess.</p>
      <div class="row">
        <label>Cell
          <select id="cell">
            <option value="calm">Calm coast</option>
            <option value="cyclone">Cyclone cell</option>
          </select>
        </label>
        <label class="check"><input id="kill-weather" type="checkbox" /> Kill weather source</label>
      </div>
      <label>Typed question
        <textarea id="text" placeholder="Where is the nearest fishing zone?"></textarea>
      </label>
      <div class="row">
        <button id="ask" type="button">Ask (text)</button>
        <button id="ptt-pfz" class="secondary" type="button">Push to talk: fishing zone</button>
        <button id="ptt-safe" class="secondary" type="button">Push to talk: safety</button>
      </div>
      <p class="status" id="status">Ready — mock ASR, mock LLM, fixture data. No keys required.</p>
      <div id="answer"><strong>Answer</strong><div id="answer-body">Waiting for a question.</div><div class="cite" id="cites"></div></div>
    </main>
    <script>
      const status = document.getElementById("status");
      const bodyEl = document.getElementById("answer-body");
      const citesEl = document.getElementById("cites");

      function payload(extra) {
        const kill = document.getElementById("kill-weather").checked;
        return Object.assign({
          cell_id: document.getElementById("cell").value,
          lat: 12.42,
          lon: 79.40,
          has_location: true,
          force_error: false,
          force_error_sources: kill ? ["imd_marine"] : [],
          source_lang: "en-IN"
        }, extra);
      }

      async function ask(extra) {
        status.textContent = "Running the graph…";
        const response = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload(extra))
        });
        const data = await response.json();
        bodyEl.textContent = data.text || JSON.stringify(data);
        citesEl.textContent = (data.citations || []).join(" · ");
        status.textContent = "Intent " + data.intent + " · guardrail " + data.guardrail_status;
        if (window.AudioContext && extra.audio_id) {
          /* Mock TTS is not a real WAV; text is the demo surface. */
        }
      }

      document.getElementById("ask").addEventListener("click", () => {
        ask({ text: document.getElementById("text").value || "Where is the nearest fishing zone?" });
      });
      document.getElementById("ptt-pfz").addEventListener("click", () => {
        ask({ audio_id: "pfz_query_en", text: "" });
      });
      document.getElementById("ptt-safe").addEventListener("click", () => {
        document.getElementById("cell").value = "cyclone";
        ask({ audio_id: "safety_query_en", text: "" });
      });
    </script>
  </body>
</html>
